name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: Discapture-win-x64-setup.exe
          # - os: macos-latest
          #   platform: darwin
          #   arch: arm64
          #   artifact: Discapture-darwin-arm64.dmg
          # - os: ubuntu-latest
          #   platform: linux
          #   arch: x64
          #   artifact: discapture_amd64.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev

      - name: Install dependencies
        run: bun install

      - name: Build release
        run: bun run build

      # --- Windows: Inno Setup installer ---
      - name: Build installer (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          & iscc /DAppVersion=$version "/DBuildDir=build\dev-win-x64\Discapture-dev" /DOutputDir=. "scripts\installer.iss"

